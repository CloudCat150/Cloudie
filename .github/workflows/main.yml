name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'  # v1.0.0, v2.1.3 등 Semantic Versioning 태그에 반응

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true  # 자동으로 changelog 생성
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Zip files
        run: |
          mkdir dist
          cp -r src/* dist/
          cd dist
          zip -r your-build.zip .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: dist/your-build.zip
